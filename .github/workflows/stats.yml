name: Update profile stats

on:
  schedule:
    - cron: "17 6 * * *"   # daily 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/generate_readme.py", ".github/workflows/stats.yml"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate README
        env:
          GH_PAT: ${{ secrets.GH_PAT }}   # PAT with repo + read:user; sees private repos
        run: python3 .github/generate_readme.py
      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: auto-update profile stats"
          git push
